name = "book-to-kindle-staging"
main = "src/index.ts"
compatibility_date = "2026-08-29"
workers_dev = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "book-to-kindle-staging"
database_id = "beaac40b-eafd-475a-b92a-f75d1d74a8c2"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "book-to-kindle-files-staging"

[[queues.producers]]
binding = "TASK_QUEUE"
queue = "book-to-kindle-tasks-staging"

[[queues.consumers]]
queue = "book-to-kindle-tasks-staging"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "book-to-kindle-dlq-staging"

[vars]
APP_ENV = "staging"
TEMP_OBJECT_TTL_HOURS = "24"
MAX_CLOUD_FILE_BYTES = "20971520"
MAX_TELEGRAM_IMAGE_BYTES = "4194304"
